<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.55" stop-color="#1a1040"/>
      <stop offset="1" stop-color="#2a0a4a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1163"/>
      <stop offset="1" stop-color="#140630"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a1fff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pillar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1b56ff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="720" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80"  cy="90"  r="1.2" opacity="0.8"/>
    <circle cx="180" cy="40"  r="1"   opacity="0.6"/>
    <circle cx="260" cy="130" r="1.5" opacity="0.9"/>
    <circle cx="420" cy="60"  r="1"   opacity="0.5"/>
    <circle cx="560" cy="110" r="1.2" opacity="0.7"/>
    <circle cx="700" cy="50"  r="1"   opacity="0.6"/>
    <circle cx="820" cy="150" r="1.4" opacity="0.8"/>
    <circle cx="960" cy="80"  r="1"   opacity="0.5"/>
    <circle cx="1080" cy="40" r="1.3" opacity="0.7"/>
    <circle cx="1140" cy="130" r="1" opacity="0.6"/>
  </g>

  <!-- Distant skyline -->
  <g fill="#1b0a3a" opacity="0.9">
    <rect x="40"   y="360" width="60"  height="180"/>
    <rect x="120"  y="320" width="80"  height="220"/>
    <rect x="220"  y="380" width="50"  height="160"/>
    <rect x="290"  y="340" width="70"  height="200"/>
    <rect x="380"  y="300" width="90"  height="240"/>
    <rect x="490"  y="360" width="60"  height="180"/>
    <rect x="570"  y="330" width="80"  height="210"/>
    <rect x="670"  y="370" width="50"  height="170"/>
    <rect x="740"  y="310" width="100" height="230"/>
    <rect x="860"  y="350" width="70"  height="190"/>
    <rect x="950"  y="330" width="90"  height="210"/>
    <rect x="1060" y="360" width="60"  height="180"/>
  </g>

  <!-- Hills -->
  <path d="M0 540 Q 200 460 400 520 T 800 500 T 1200 520 L 1200 720 L 0 720 Z" fill="url(#hill)"/>

  <!-- Foreground neon pillars -->
  <g>
    <rect x="80"   y="300" width="18" height="340" rx="3" fill="url(#pillar)"  opacity="0.85"/>
    <rect x="80"   y="300" width="18" height="340" rx="3" fill="url(#pillar)"  opacity="0.5" filter="url(#soft)"/>
    <rect x="260"  y="260" width="18" height="380" rx="3" fill="url(#pillar2)" opacity="0.85"/>
    <rect x="260"  y="260" width="18" height="380" rx="3" fill="url(#pillar2)" opacity="0.5" filter="url(#soft)"/>
    <rect x="520"  y="320" width="18" height="320" rx="3" fill="url(#pillar)"  opacity="0.85"/>
    <rect x="520"  y="320" width="18" height="320" rx="3" fill="url(#pillar)"  opacity="0.5" filter="url(#soft)"/>
    <rect x="820"  y="280" width="18" height="360" rx="3" fill="url(#pillar2)" opacity="0.85"/>
    <rect x="820"  y="280" width="18" height="360" rx="3" fill="url(#pillar2)" opacity="0.5" filter="url(#soft)"/>
    <rect x="1080" y="300" width="18" height="340" rx="3" fill="url(#pillar)"  opacity="0.85"/>
    <rect x="1080" y="300" width="18" height="340" rx="3" fill="url(#pillar)"  opacity="0.5" filter="url(#soft)"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="640" width="1200" height="80" fill="#07031a"/>
  <rect x="0" y="640" width="1200" height="2"  fill="#ff2e88" opacity="0.9"/>

  <!-- Platform -->
  <rect x="720" y="500" width="200" height="14" rx="3" fill="#130934" stroke="#00e8ff" stroke-width="1.5" opacity="0.9"/>

  <!-- Tracer / bullet trail -->
  <g stroke-linecap="round">
    <line x1="520" y1="560" x2="820" y2="440" stroke="#ffd166" stroke-width="3" opacity="0.9"/>
    <line x1="520" y1="560" x2="820" y2="440" stroke="#ffd166" stroke-width="10" opacity="0.25" filter="url(#soft)"/>
  </g>

  <!-- Muzzle flash -->
  <circle cx="520" cy="560" r="40" fill="url(#glow)" opacity="0.9"/>
  <circle cx="520" cy="560" r="12" fill="#fff2b0"/>

  <!-- Player (stick figure silhouette) -->
  <g stroke="#f8f8ff" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="480" cy="520" r="14" fill="#f8f8ff"/>
    <line x1="480" y1="534" x2="480" y2="590"/>
    <line x1="480" y1="590" x2="465" y2="635"/>
    <line x1="480" y1="590" x2="498" y2="635"/>
    <line x1="480" y1="555" x2="455" y2="580"/>
    <line x1="480" y1="555" x2="520" y2="560"/>
  </g>

  <!-- Enemy silhouette -->
  <g stroke="#ff6a6a" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="870" cy="455" r="12" fill="#ff6a6a"/>
    <line x1="870" y1="467" x2="870" y2="510"/>
    <line x1="870" y1="510" x2="858" y2="545"/>
    <line x1="870" y1="510" x2="882" y2="545"/>
    <line x1="870" y1="485" x2="850" y2="505"/>
    <line x1="870" y1="485" x2="892" y2="498"/>
  </g>

  <!-- Title lockup -->
  <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle">
    <text x="600" y="210" font-size="110" fill="#ff2e88" letter-spacing="8" opacity="0.25" filter="url(#soft)">NEON STRIKE</text>
    <text x="600" y="210" font-size="110" fill="#fff"   letter-spacing="8">NEON STRIKE</text>
    <text x="600" y="258" font-size="22"  fill="#00e8ff" letter-spacing="14">2D ACTION SHOOTER · C++</text>
  </g>
</svg>

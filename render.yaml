services:
  - type: web
    name: christian-delapos-portfolio
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Optimized images and Vite's built assets have content hashes in their
      # file names (a change means a new URL), so browsers can keep them forever
      - path: /images/opt/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /mascots/*
        name: Cache-Control
        value: public, max-age=604800
